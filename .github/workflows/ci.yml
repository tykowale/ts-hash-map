name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, build, package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- -f github
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:package

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.node == 24
        run: npm run coverage
      - if: matrix.node != 24
        run: npm test

  bench-smoke:
    # Proves every benchmark still runs and its untimed result checks pass. Timings from shared
    # runners are too noisy to judge, so nothing here gates on speed; see bench/README.md.
    name: Benchmark smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run bench:smoke -- --out bench/results/smoke.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-smoke-node${{ matrix.node }}
          path: bench/results/smoke.json
          if-no-files-found: ignore
